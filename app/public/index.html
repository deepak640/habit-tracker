<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#041330">
  <meta name="color-scheme" content="light">
  <title>Habits</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true">
    <div class="sky" id="sky"></div>
    <div class="splash-in">
      <div class="logo-wrap">
        <div class="comet"></div>
        <div class="shock"></div><div class="shock s2"></div>
        <div class="sparks" id="sparks"></div>
        <img class="logo" src="logo.png" alt="">
      </div>
      <h2 id="greet" class="greet">Good morning</h2>
      <p class="tag">Track your habits</p>
    </div>
  </div>

  <main class="app">
    <header class="top">
      <div>
        <h1 id="title">Today</h1>
      </div>
      <div class="weeknav" id="weeknav">
        <button id="prev" aria-label="Previous week">‹</button>
        <button id="today">Today</button>
        <button id="next" aria-label="Next week">›</button>
      </div>
    </header>

    <div class="notice" id="notice" hidden></div>

    <!-- Dashboard: check in only -->
    <div class="tab" id="tab-dashboard">
      <nav class="strip" id="strip" aria-label="Pick a day"></nav>

      <section class="hero card">
        <div class="hero-row">
          <div>
            <p class="label" id="heroLabel"></p>
            <p class="sub" id="heroSub"></p>
          </div>
          <p class="big"><span id="heroPct">0</span><small>%</small></p>
        </div>
        <div class="bar"><i id="heroBar"></i></div>
      </section>

      <section class="list card" id="list" aria-label="Habits for the selected day"></section>
    </div>

    <!-- Control: add and remove habits -->
    <div class="tab" id="tab-control" hidden>
      <form class="add card" id="add">
        <input id="name" placeholder="New habit" maxlength="60" autocomplete="off" aria-label="Habit name">
        <button type="submit">Add</button>
      </form>
      <section class="remind card" id="remind" hidden>
        <div><b>Reminder</b></div>
        <select id="remindEvery" aria-label="Reminder repeat">
          <option value="1">Every hour</option>
          <option value="2">Every 2 hours</option>
          <option value="3">Every 3 hours</option>
          <option value="4">Every 4 hours</option>
          <option value="6">Every 6 hours</option>
        </select>
        <button type="button" class="switch" id="remindOn" role="switch" aria-checked="false" aria-label="Reminder on"><i></i></button>
      </section>
      <section class="list card" id="manage" aria-label="Manage habits"></section>
      <button id="server" class="server" hidden>⚙︎ Server</button>
    </div>

    <!-- Diet: chat with Gemini about calories and protein -->
    <div class="tab" id="tab-diet" hidden>
      <div class="chat-bar">
        <div class="coach"><img src="logo.png" alt=""><div><b>Diet coach</b><small>Calories &amp; protein</small></div></div>
        <button type="button" id="dietClear" class="clear" aria-label="Clear chat" title="Clear chat"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
      </div>
      <section class="chat" id="chat" aria-live="polite"></section>
      <form class="composer" id="dietForm">
        <input id="dietText" placeholder="What did you eat?" maxlength="2000" autocomplete="off" aria-label="Message">
        <button type="submit" id="dietSend" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </form>
    </div>

    <!-- Overall: weekly and daily progress -->
    <div class="tab" id="tab-overall" hidden>
      <div class="seg" role="tablist">
        <button id="seg-weekly" class="on" role="tab">Weekly</button>
        <button id="seg-daily" role="tab">Daily</button>
      </div>

      <section class="hero card">
        <div class="hero-row">
          <div>
            <p class="label" id="ovLabel"></p>
            <p class="sub" id="ovSub"></p>
          </div>
          <p class="big"><span id="ovPct">0</span><small>%</small></p>
        </div>
        <div class="bar"><i id="ovBar"></i></div>
      </section>

      <section class="card panel">
        <div class="panel-head"><h2 id="chartTitle"></h2><p class="sub" id="chartHint"></p></div>
        <div class="chart" id="chart" aria-label="Progress chart"></div>
      </section>

      <section class="card panel">
        <div class="panel-head"><h2 id="detailTitle"></h2></div>
        <div id="detail"></div>
      </section>
    </div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <span class="glide" id="glide" aria-hidden="true"></span>
    <button data-tab="dashboard" class="on">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      <span>Dashboard</span>
    </button>
    <button data-tab="control">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span>Control</span>
    </button>
    <button data-tab="diet">
      <svg viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-4 3.5V17H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>
      <span>Diet</span>
    </button>
    <button data-tab="overall">
      <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      <span>Overall</span>
    </button>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
